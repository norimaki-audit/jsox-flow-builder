name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript構文チェック（単一HTML内のメインスクリプト）
        run: |
          node -e '
            const fs=require("fs");
            const src=fs.readFileSync("jsox_flow_builder.html","utf8");
            const m=[...src.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(x=>x[1]).find(s=>s.includes("function renderFlow"));
            if(!m){console.error("main script not found");process.exit(1);}
            fs.writeFileSync("/tmp/main.js",m);
          '
          node --check /tmp/main.js
          echo "✓ syntax OK"

      - name: 必須ファイルの存在確認
        run: |
          for f in index.html manual.html jsox_flow_builder.html README.md docs/CHANGELOG.md LICENSE.md licenses/THIRD_PARTY_NOTICES.md .github/CONTRIBUTING.md .github/SECURITY.md docs/PRIVACY.md docs/USER_GUIDE.md docs/DEVELOPMENT.md assets/og/og.png assets/demo/demo.mp4; do
            test -f "$f" || { echo "MISSING: $f"; exit 1; }
          done
          echo "✓ required files OK"

      - name: HTML/READMEが参照するローカル画像・ファイルの存在確認
        run: |
          python3 - <<'PY'
          import re,os,sys
          missing=[]
          def check(path, text):
              for m in re.findall(r'(?:src|href)="(assets/[^"#?]+)"', text)+re.findall(r'\]\((assets/[^)#?]+)\)', text):
                  if not os.path.isfile(m): missing.append(f"{path}: {m}")
          for f in ["index.html","manual.html","README.md"]:
              check(f, open(f,encoding="utf-8").read())
          if missing:
              print("\n".join(missing)); sys.exit(1)
          print("✓ asset references OK")
          PY

      - name: レスポンシブ体裁の再発防止チェック
        run: |
          # PC/SPの二重出し分け（pc-only/sp-only/pc-heading/sp-heading）は廃止済み。復活させない
          ! grep -nE 'class="[^"]*(sp|pc)-(only|heading)' index.html manual.html \
            || { echo "NG: pc-only/sp-only系の二重出し分けが復活しています"; exit 1; }
          echo "✓ responsive single-system OK"

      - name: 旧表記［反映］の再発防止チェック
        run: |
          # ユーザー向け文書のみ対象（CHANGELOGの変更履歴説明・内部関数名は除外）
          ! grep -nE '上部の［反映］|→［反映］→|\[反映\]ボタン' README.md docs/USER_GUIDE.md docs/DEVELOPMENT.md index.html manual.html \
            || { echo "NG: 旧表記［反映］が残っています"; exit 1; }
          echo "✓ 成果物へ反映 wording OK"

      - name: ライセンス整合チェック
        run: |
          for f in LICENSE.md licenses/THIRD_PARTY_NOTICES.md .github/CONTRIBUTING.md \
            licenses/SheetJS-Apache-2.0.txt licenses/ExcelJS-MIT.txt licenses/Phosphor-Icons-MIT.txt \
            licenses/IBM-Plex-OFL-1.1.txt licenses/Inter-OFL-1.1.txt; do
            test -s "$f" || { echo "MISSING: $f"; exit 1; }
          done
          grep -q "J-SOX Flow Builder Source-Available License 1.0" LICENSE.md || { echo "NG: LICENSE名称"; exit 1; }
          grep -q "J-SOX Flow Builder Source-Available License 1.0" README.md || { echo "NG: READMEにライセンス名なし"; exit 1; }
          grep -q "Source-Available" README.md && grep -q "LICENSE.md" README.md || { echo "NG: README表示"; exit 1; }
          grep -q "謝辞" README.md || { echo "NG: READMEに謝辞（旧ACKNOWLEDGEMENTS）なし"; exit 1; }
          grep -q "Source-Available License 1.0" jsox_flow_builder.html || { echo "NG: アプリのライセンス表示"; exit 1; }
          grep -q "LICENSE.md" index.html || { echo "NG: LPから利用条件に到達できない"; exit 1; }
          grep -q "LICENSE.md" manual.html || { echo "NG: manualから利用条件に到達できない"; exit 1; }
          ! grep -nE "License: MIT|MITライセンスで公開|は(オープンソース|OSS)(ソフトウェア)?です" README.md \
            || { echo "NG: 本体ライセンスの誤記（MIT/オープンソース）"; exit 1; }
          echo "✓ license consistency OK"

      - name: セルフテスト件数とドキュメントの一致
        run: |
          N=$(grep -oP 'const SELF_TEST_COUNT=\K\d+' jsox_flow_builder.html | head -1)
          [ -n "$N" ] || { echo "SELF_TEST_COUNT not found"; exit 1; }
          for f in README.md docs/CHANGELOG.md docs/DEVELOPMENT.md; do
            grep -q "${N}項目" "$f" || { echo "NG: $f に ${N}項目 の記載がありません"; exit 1; }
          done
          echo "✓ self-test count ($N) consistent"

      - name: 組み込みセルフテスト（headless Chrome）
        run: |
          python3 -m http.server 8807 &> /dev/null &
          sleep 2
          CHROME=$(which google-chrome || which chromium-browser || which chromium)
          "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=20000 \
            --dump-dom "http://localhost:8807/jsox_flow_builder.html?selftest=1" > /tmp/selftest.html 2>/dev/null
          RESULT=$(grep -oP 'セルフテスト結果: \d+ / \d+' /tmp/selftest.html | head -1)
          echo "selftest: $RESULT"
          [ -n "$RESULT" ] || { echo "selftest result not found"; exit 1; }
          OK=$(echo "$RESULT" | grep -oP '\d+' | sed -n 1p)
          TOTAL=$(echo "$RESULT" | grep -oP '\d+' | sed -n 2p)
          [ "$OK" = "$TOTAL" ] || { echo "selftest failed: $RESULT"; exit 1; }
          echo "✓ selftest $RESULT"

      - name: 主要画面の起動確認（コンソールエラー検出込み）
        run: |
          CHROME=$(which google-chrome || which chromium-browser || which chromium)
          for pg in steps flow rcmdoc import; do
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=12000 \
              --dump-dom "http://localhost:8807/jsox_flow_builder.html?pg=$pg" > /tmp/pg.html 2>/tmp/pg.err
            grep -q "J-SOX Flow Builder" /tmp/pg.html || { echo "page $pg failed to render"; exit 1; }
            ! grep -iE "Uncaught|TypeError|ReferenceError" /tmp/pg.err || { echo "console error on $pg"; cat /tmp/pg.err; exit 1; }
          done
          echo "✓ pages render OK"

      - name: 生成物サイズの記録
        run: |
          {
            echo "## Build sizes"
            echo "| file | size |"
            echo "|---|---|"
            for f in jsox_flow_builder.html index.html manual.html; do
              echo "| $f | $(du -h "$f" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
